name: Build ZivexShop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZivexShop
          path: target/*.jar
          if-no-files-found: error
