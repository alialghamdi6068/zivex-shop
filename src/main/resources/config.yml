settings:
  main-title: "&8Shop"
  category-title-format: "&8{category} Shop"
  purchase-title: "&8Purchase: {item}"
  main-size: 27
  category-size: 27
  purchase-size: 27
  close-on-purchase: true
  sounds: true
  currency-symbol: "$"
  shard-currency-name: "Shards"
  max-quantity: 64
  quantity-step: 1
  refund-on-delivery-failure: true

economy:
  required: true
  core-plugin: "VoidFlame-Core"
  service-getter: "getEconomyService"
  balance-method: "getBalance"
  withdraw-method: "withdraw"
  deposit-method: "deposit"

integrations:
  phoenix-crate-lite:
    enabled: true
    key-command: "crate key give {player} {key} {amount}"
  smart-spawners:
    enabled: true
    spawner-command: "ss give {player} smart_spawner {type} {amount}"
    note: "target must match the top-level name in SmartSpawner spawner_mobs.yml."

messages:
  prefix: "&8[&5ZivexShop&8] &r"
  no-permission: "&cYou don't have permission."
  player-only: "&cThis command is for players."
  reloaded: "&aShop configuration reloaded."
  invalid-item: "&cUnknown shop item."
  invalid-category: "&cUnknown shop category."
  duplicate-slot: "&c[Shop] ERROR: Duplicate slot detected: {slot}"
  no-economy: "&cVoidFlame-Core economy service is unavailable."
  no-shard-economy: "&cZivexShards is not installed or configured yet. Shard purchases are disabled."
  insufficient: "&cYou need {price} {currency}."
  purchased: "&aPurchased &f{amount}x {item} &afor &f{total} {currency}&a."
  delivery-failed: "&cPurchase failed while delivering the item. Your balance was restored."

