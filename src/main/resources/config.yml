# ╔══════════════════════════════════════════════════════════════╗
# ║                     ZivexShop Configuration                 ║
# ╚══════════════════════════════════════════════════════════════╝
#
# All in-game text is English.
# Main shop layout follows the classic DonutSMP 27-slot chest layout:
# category icons at slots 11-15, item row at slots 9-17, back at slot 18.

settings:
  # ──────────────────────────────────────────────────────────────
  # GUI
  # ──────────────────────────────────────────────────────────────
  main-title: "&8Shop"
  category-title-format: "&8{category}"
  purchase-title: "&8Purchase: {item}"

  main-size: 27
  category-size: 27
  purchase-size: 27

  # Donut-style category menu: 9-item row + back button.
  back-slot: 18

  # ──────────────────────────────────────────────────────────────
  # Purchase controls
  # ──────────────────────────────────────────────────────────────
  quantity-step: 1
  max-quantity: 64
  close-on-purchase: true
  refund-on-delivery-failure: true

  # ──────────────────────────────────────────────────────────────
  # Economy
  # ──────────────────────────────────────────────────────────────
  sounds: true
  currency-symbol: "$"
  shard-currency-name: "Shards"

  # ──────────────────────────────────────────────────────────────
  # Admin editor
  # ──────────────────────────────────────────────────────────────
  editor-enabled: true
  editor-price-step-small: 1
  editor-price-step-large: 100

  # Shared Zivex database location.
  database-file: "../Zivex/database.db"

integrations:
  # Phoenix Crate Lite
  phoenix-crate-lite:
    enabled: true
    key-command: "/crates giveKey {key} {player} {amount}"

  # Smart Spawners
  smart-spawners:
    enabled: true
    # AUTO uses SmartSpawner 1.8+ syntax when that version is detected.
    # Set MODERN or LEGACY if your server uses a custom/older command format.
    mode: "AUTO"
    modern-command: "/ss give {player} smart_spawner {type} {amount}"
    legacy-command: "/ss give {player} {type} {amount}"

sounds:
  open:
    sound: "BLOCK_CHEST_OPEN"
    volume: 0.8
    pitch: 1.0

  category:
    sound: "BLOCK_CHEST_OPEN"
    volume: 0.8
    pitch: 1.05

  purchase:
    sound: "UI_BUTTON_CLICK"
    volume: 0.7
    pitch: 1.0

  success:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 0.8
    pitch: 1.1

  fail:
    sound: "ENTITY_VILLAGER_NO"
    volume: 0.7
    pitch: 1.0

messages:
  prefix: "&5&lZivex &8» "
  no-permission: "&cYou don't have permission."
  player-only: "&cThis command can only be used by a player."

  reloaded: "&aShop configuration reloaded."
  invalid-item: "&cUnknown shop item."
  invalid-category: "&cUnknown shop category."
  duplicate-slot: "&cA shop slot is already occupied: {slot}"
  move-category: "&eMove mode enabled. Click a category slot to swap its position."

  no-economy: "&cThe money economy is unavailable right now."
  no-shard-economy: "&cThe Shards economy is unavailable right now."
  invalid-shard-price: "&cThis Shards price is invalid."
  unsupported-currency: "&cUnsupported shop currency: {currency}."

  insufficient: "&cYou do not have enough currency for this purchase."
  purchased: "&aPurchased &f{amount}x {item} &afor &f{total}."
  delivery-failed: "&cPurchase failed while delivering the item. Your balance was restored."
  refund-failed: "&cPurchase delivery failed and the automatic refund also failed. Contact an administrator immediately."

  item-disabled: "&cThis item is currently disabled."
  purchase-processing: "&eYour purchase is already being processed."
  inventory-full: "&cYou do not have enough inventory space for this purchase."
  invalid-amount: "&cThe purchase amount is invalid."
  invalid-price: "&cThis item has an invalid price."

  player-usage: "&cUsage: /shop"
  admin-usage: "&cUsage: /shopadmin <gui|reload|list|debug|setprice|setslot|enable|disable|add|delete|give|money>"

  price-updated: "&aPrice updated."
  slot-updated: "&aSlot updated."
  item-updated: "&aItem updated."
  invalid-slot: "&cThat slot is invalid or already occupied."
  invalid-number: "&cEnter a valid number."
  player-not-found: "&cPlayer not found."

  delivered: "&aDelivered &f{amount}x {item} &ato &f{player}&a."
  editor-disabled: "&cThe in-game shop editor is disabled."
  move-item: "&eMove mode enabled. Click an empty slot in the same category."
  money-updated: "&aMoney balance updated."
  add-usage: "&cUsage: /shopadmin add <category> <id> <material> <slot> <price> <currency> <delivery> [amount] [target]"
  delete-usage: "&cUsage: /shopadmin delete <category> <id>"
  delete-confirm: "&eClick Delete Item again to confirm permanent deletion."
  invalid-material: "&cUnknown Minecraft material."
  invalid-delivery: "&cUnsupported delivery type."
  item-added: "&aAdded &f{item} &ato category &f{category}&a."
  item-add-failed: "&cCould not add the item. Check the category, ID, slot, price, and amount."
  item-deleted: "&aDeleted &f{item} &afrom category &f{category}&a."

