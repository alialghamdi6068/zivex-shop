# ZivexShop Configuration
# الإعدادات قابلة للتعديل من هنا. النصوص داخل اللعبة بالإنجليزية، والتعليقات فقط للشرح.

settings:
  # كل القوائم المطلوبة 27 خانة فقط.
  main-title: "&8Shop"
  category-title-format: "&8{category} Shop"
  purchase-title: "&8Purchase: {item}"
  main-size: 27
  category-size: 27
  purchase-size: 27
  back-slot: 18

  # التحكم بالكمية.
  quantity-step: 1
  max-quantity: 64

  close-on-purchase: true
  refund-on-delivery-failure: true
  sounds: true
  currency-symbol: "$"
  shard-currency-name: "Shards"

  # محرر الأدمن.
  editor-enabled: true
  editor-price-step-small: 1
  editor-price-step-large: 100

  # قاعدة البيانات المشتركة.
  database-file: "../Zivex/database.db"

integrations:
  phoenix-crate-lite:
    enabled: true
    key-command: "/crates giveKey {key} {player} {amount}"
  smart-spawners:
    enabled: true
    spawner-command: "/ss give {player} smart_spawner {type} {amount}"
    # يجب أن يطابق target الاسم الفعلي للـSpawner في الإضافة.

sounds:
  open:
    sound: "BLOCK_CHEST_OPEN"
    volume: 0.8
    pitch: 1.0
  category:
    sound: "BLOCK_CHEST_OPEN"
    volume: 0.8
    pitch: 1.05
  purchase:
    sound: "UI_BUTTON_CLICK"
    volume: 0.7
    pitch: 1.0
  success:
    sound: "ENTITY_PLAYER_LEVELUP"
    volume: 0.8
    pitch: 1.1
  fail:
    sound: "ENTITY_VILLAGER_NO"
    volume: 0.7
    pitch: 1.0

