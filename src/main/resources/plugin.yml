name: ZivexShop
version: 1.0.0
main: me.voidflame.zivexshop.ZivexShopPlugin
api-version: '26.2'
author: VoidFlame
website: https://github.com/alialghamdi6068/zivex-shop
description: Configurable VoidFlameMC shop with built-in economy, Shards, crate and spawner delivery integrations.
softdepend:
  - PhoenixCrates
  - PhoenixCrateLite
  - SmartSpawner
  - ZivexShards
commands:
  shop:
    description: Open the Zivex shop.
    aliases: [zivexshop]
    usage: /shop
    permission: zivexshop.use
  shopadmin:
    description: Administrative ZivexShop controls.
    aliases: [zshop]
    usage: /shopadmin <gui|reload|list|debug|setprice|setslot|enable|disable|give>
    permission: zivexshop.admin
permissions:
  zivexshop.use:
    default: true
  zivexshop.admin:
    default: op
